name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (HA ${{ matrix.ha }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ha: "2025.10 (minimum)"
            python: "3.13"
            requirements: requirements_test_min.txt
            latest: false
          - ha: "2026.9 (latest)"
            python: "3.14"
            requirements: requirements_test.txt
            latest: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: |
          python -m pip install -r ${{ matrix.requirements }}
          python scripts/component_requirements.py > requirements_components.txt
          python -m pip install -r requirements_components.txt
      - name: Ruff (lint)
        run: ruff check .
      - name: Pytest
        run: pytest tests
